name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Run tests
        run: python -m pytest -q

      - name: Validate labeled data
        run: python scripts/validate_labels.py

      - name: Run replay eval quality gate
        run: |
          python scripts/run_eval.py \
            --replay-predictions tests/fixtures/replay_predictions.jsonl \
            --min-overall 0.99 \
            --min-metric exact_accuracy.seniority=1.0 \
            --min-metric soft_list_f1.required_skills=1.0
